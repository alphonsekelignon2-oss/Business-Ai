name: Build Business IA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Décompresser le projet
        run: |
          unzip -q BusinessIA-Android.zip -d extracted
          ls -la extracted/BusinessIA

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Construire l'APK
        working-directory: extracted/BusinessIA
        run: gradle assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessIA-APK
          path: extracted/BusinessIA/app/build/outputs/apk/debug/app-debug.apk
